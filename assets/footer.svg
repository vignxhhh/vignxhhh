<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Let's build something"><style>@font-face{font-family:Ar9;src:url(data:font/woff2;base64,) format('woff2');font-display:swap}@font-face{font-family:In5;src:url(data:font/woff2;base64,) format('woff2');font-display:swap}
.sh{fill:#111010}.edge{stroke:#111010}
@media (prefers-color-scheme:dark){.sh{fill:#F4EFE6}.edge{stroke:#F4EFE6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.bot{animation:roll 6s ease-in-out infinite alternate}@keyframes roll{from{transform:translateX(-120px)}to{transform:translateX(60px)}}
.spoke{transform-box:view-box;transform-origin:1060px 78px;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.eye{animation:bl 3.2s step-end infinite}@keyframes bl{95%{opacity:0}}</style><rect class="sh" x="10" y="10" width="1186" height="106" rx="18"/><rect x="3" y="3" width="1186" height="106" rx="18" fill="#86DDBE" stroke="#111010" stroke-width="3"/><text x="34.0" y="56.0" font-family="Ar9,'Arial Black',Arial,sans-serif" font-size="30" fill="#111010" letter-spacing="-0.6">LET'S BUILD SOMETHING.</text><text x="34.0" y="84.0" font-family="In5,Helvetica,Arial,sans-serif" font-size="15" fill="#111010">Open to Summer 2027 internships and research in robotics, AI hardware and semiconductors.</text><g class="bot"><g transform="translate(1060 86)"><circle class="wheel" cx="0" cy="-8" r="8" fill="#111010"/><rect class="spoke" x="-1.5" y="-14" width="3" height="12" fill="#FFFDF8"/><path d="M0 -50 L-3 -62" stroke="#111010" stroke-width="3"/><circle cx="-3" cy="-65" r="4.5" fill="#F4C542" stroke="#111010" stroke-width="3"/><rect x="-17" y="-50" width="34" height="36" rx="9" fill="#F0825A" stroke="#111010" stroke-width="3"/><rect x="-8" y="-42" width="22" height="13" rx="5" fill="#111010"/><rect class="eye" x="-3" y="-39" width="4" height="6" fill="#48E877"/><rect class="eye" x="6" y="-39" width="4" height="6" fill="#48E877"/></g></g></svg>